<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKJ Handnotes Maker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SKJ Handnotes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Indie+Flower&family=Kalam:wght@400&family=Patrick+Hand&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px -apple-system,system-ui,sans-serif;color:#1e1b3a;background:linear-gradient(160deg,#fdf2f8,#eef2ff 45%,#ecfeff);min-height:100vh}
header{background:linear-gradient(120deg,#6d28d9,#db2777 60%,#f59e0b);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 26px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px #6d28d955;text-align:center}
header h1{margin:0;font-size:26px}header p{margin:6px 0 0;opacity:.9;font-size:14px}
main{max-width:680px;margin:0 auto;padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 30px)}
.c{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 14px #4c1d9522;border-left:6px solid var(--k)}
.c h2{margin:0 0 8px;font-size:17px;color:var(--k)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
input[type=file],select{width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:12px;background:#faf9ff;font-size:16px;color:#1e1b3a}
input[type=range]{width:100%;accent-color:var(--k)}input[type=color]{width:48px;height:36px;border:0;background:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #d1d5db;transition:.15s}.sw.on{box-shadow:0 0 0 4px #6d28d9;transform:scale(1.12)}
button.go{width:100%;padding:16px;font-size:18px;border:0;border-radius:16px;background:linear-gradient(120deg,#6d28d9,#db2777);color:#fff;font-weight:700;box-shadow:0 6px 18px #db277766;margin-top:6px}
button.go:active{transform:scale(.98)}button:disabled{opacity:.45}
small{color:#6b7280}#st{text-align:center;font-weight:600;color:#6d28d9}
#hw{font-size:28px;min-height:44px;margin-top:8px;padding:6px 10px;background:repeating-linear-gradient(#fffef8,#fffef8 33px,#a9c4e4 34px);border-radius:10px}
#prev img{width:100%;border-radius:10px;margin-top:10px;box-shadow:0 4px 14px #0003}
#saved{font-size:13px;color:#059669;font-weight:600;margin-top:4px}
</style></head><body>
<header><h1>✍️ SKJ Handnotes Maker</h1><p>Turn any PDF into ruled notebook notes in your own handwriting</p></header>
<main>
<div class="c" style="--k:#2563eb"><h2>① Upload PDF</h2><input type="file" id="pdf" accept="application/pdf"></div>
<div class="c" style="--k:#db2777"><h2>② Handwriting</h2>
<select id="font"><option>Caveat</option><option>Indie Flower</option><option>Kalam</option><option>Patrick Hand</option><option>Shadows Into Light</option></select>
<label>Upload YOUR handwriting font (.ttf / .otf / .woff)</label><input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2">
<div id="saved"></div><small>Make a font from your writing free at Calligraphr.com. It is remembered on this device.</small>
<div id="hw">The quick brown fox 0123</div>
<label>Text size: <span id="sv">34</span></label><input type="range" id="size" min="24" max="48" value="34">
<label>Messiness</label><input type="range" id="mess" min="0" max="10" value="4"></div>
<div class="c" style="--k:#059669"><h2>③ Pen colour</h2><div class="row" id="pens"></div>
<div class="row" style="margin-top:10px"><span>Custom:</span><input type="color" id="cp" value="#1e3fb4"></div></div>
<div class="c" style="--k:#d97706"><h2>④ Paper</h2><select id="paper"><option value="ruled">Ruled notebook + margin</option><option value="ruledn">Ruled notebook (no margin)</option><option value="plain">Plain</option></select>
<label><input type="checkbox" id="fig" checked> Include drawings / charts from the PDF (redrawn in pen colour)</label></div>
<button class="go" id="go" disabled>✨ Create handwritten PDF</button>
<p id="st"></p><div id="dlw"></div><div id="prev"></div>
</main>
<script>
const $=id=>document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pen="#1e3fb4",file=null,fam="Caveat",custom=false;
const W=1240,H=1754,LH=48,TOP=170,BOT=H-90,LM=190,RM=W-80;
["#1e3fb4","#111111","#c0392b","#1e8449","#6c3483"].forEach((c,i)=>{const b=document.createElement("button");b.className="sw"+(i?"":" on");b.style.background=c;b.onclick=()=>{pen=c;$("cp").value=c;mark(b)};$("pens").append(b)});
function mark(b){document.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));b&&b.classList.add("on")}
$("cp").oninput=e=>{pen=e.target.value;mark()};
$("pdf").onchange=e=>{file=e.target.files[0];$("go").disabled=!file};
$("size").oninput=e=>$("sv").textContent=e.target.value;
$("font").onchange=e=>{fam=e.target.value;custom=false;$("hw").style.fontFamily=`'${fam}'`};
$("hw").style.fontFamily="'Caveat'";
$("ff").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const ff=new FontFace("MyHand",await f.arrayBuffer());await ff.load();document.fonts.add(ff);fam="MyHand";custom=true;$("hw").style.fontFamily="MyHand"}catch(x){$("st").textContent="Could not read that font file."}};
const rnd=m=>(Math.random()-.5)*m;
function paper(ctx,type){ctx.fillStyle="#fdfcf7";ctx.fillRect(0,0,W,H);if(type==="plain")return;
ctx.strokeStyle="#a9c4e4";ctx.lineWidth=2;for(let y=TOP;y<H-50;y+=LH){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
if(type==="ruled"){ctx.strokeStyle="#e08a8a";ctx.beginPath();ctx.moveTo(LM-35,0);ctx.lineTo(LM-35,H);ctx.stroke();ctx.beginPath();ctx.moveTo(LM-29,0);ctx.lineTo(LM-29,H);ctx.stroke()}}
function inkify(src){const c=document.createElement("canvas");c.width=src.width;c.height=src.height;const x=c.getContext("2d");x.drawImage(src,0,0);
const d=x.getImageData(0,0,c.width,c.height),p=d.data,r=parseInt(pen.slice(1,3),16),g=parseInt(pen.slice(3,5),16),b=parseInt(pen.slice(5,7),16);
for(let i=0;i<p.length;i+=4){const l=(p[i]+p[i+1]+p[i+2])/3,a=Math.max(0,Math.min(255,(235-l)*2.2));p[i]=r;p[i+1]=g;p[i+2]=b;p[i+3]=a}
x.putImageData(d,0,0);return c}
async function figures(page,items){const vp=page.getViewport({scale:1.6}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;const x=c.getContext("2d");
await page.render({canvasContext:x,viewport:vp}).promise;x.fillStyle="#fff";
for(const it of items){if(!it.str.trim())continue;const t=pdfjsLib.Util.transform(vp.transform,it.transform),h=Math.hypot(t[2],t[3]);x.fillRect(t[4]-4,t[5]-h*1.05,it.width*1.6+8,h*1.35)}
const d=x.getImageData(0,0,c.width,c.height).data,rows=[];
for(let y=0;y<c.height;y++){let n=0;for(let xx=0;xx<c.width;xx++){const i=(y*c.width+xx)*4;if(d[i]+d[i+1]+d[i+2]<600)n++}rows.push(n>2)}
const out=[];let s=-1,gap=0;for(let y=0;y<=c.height;y++){if(y<c.height&&rows[y]){if(s<0)s=y;gap=0}else if(s>=0){gap++;if(gap>18||y===c.height){const e=y-gap;if(e-s>45){let x0=c.width,x1=0;for(let yy=s;yy<=e;yy++)for(let xx=0;xx<c.width;xx++){const i=(yy*c.width+xx)*4;if(d[i]+d[i+1]+d[i+2]<600){if(xx<x0)x0=xx;if(xx>x1)x1=xx}}
if(x1-x0>45){const f=document.createElement("canvas");f.width=x1-x0+12;f.height=e-s+12;f.getContext("2d").drawImage(c,x0-6,s-6,f.width,f.height,0,0,f.width,f.height);out.push({y:s,c:inkify(f)})}}s=-1;gap=0}}}
return out}
async function lines(page){const tc=await page.getTextContent(),m={};
tc.items.forEach(i=>{if(!i.str.trim())return;const k=Math.round(i.transform[5]/3);(m[k]=m[k]||[]).push(i)});
return{items:tc.items,rows:Object.keys(m).map(Number).sort((a,b)=>b-a).map(k=>{const a=m[k].sort((p,q)=>p.transform[4]-q.transform[4]);return{t:a.map(i=>i.str).join(" ").replace(/\s+/g," ").trim(),h:Math.max(...a.map(i=>i.height||10)),x:a[0].transform[4],y:k*3}})}}
$("go").onclick=async()=>{$("go").disabled=true;$("prev").innerHTML="";$("dlw").innerHTML="";
try{await document.fonts.load(`40px '${fam}'`);const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
const size=+$("size").value,mess=+$("mess").value,pt=$("paper").value,pages=[];let cv,ctx,y;
const np=()=>{cv=document.createElement("canvas");cv.width=W;cv.height=H;ctx=cv.getContext("2d");paper(ctx,pt);pages.push(cv);y=TOP-8};np();
const left=pt==="ruled"?LM:90;
for(let p=1;p<=pdf.numPages;p++){$("st").textContent=`Writing page ${p} of ${pdf.numPages}…`;await new Promise(r=>setTimeout(r,10));
const pg=await pdf.getPage(p),L=await lines(pg),med=L.rows.map(r=>r.h).sort((a,b)=>a-b)[L.rows.length>>1]||10;
const figs=$("fig").checked?await figures(pg,L.items):[];const ev=[...L.rows.map(r=>({k:"t",y:-r.y,r})),...figs.map(f=>({k:"f",y:f.y,f}))].sort((a,b)=>a.y-b.y);
// text y flipped (pdf bottom-up) -> -y gives top-down order; figure y is pixel top-down on a page scaled 1.6, convert approx
const ph=pg.getViewport({scale:1}).height;ev.forEach(e=>{if(e.k==="f")e.y=e.f.y/1.6-ph});ev.sort((a,b)=>a.y-b.y);
if(p>1&&y>TOP+LH){y+=LH}
for(const e of ev){if(e.k==="f"){const mw=RM-left,sc=Math.min(mw/e.f.c.width,(BOT-TOP-20)/e.f.c.height,0.8*1.6/1.6+0.2),w=e.f.c.width*sc,h=e.f.c.height*sc,hh=Math.ceil(h/LH)*LH;
if(y+hh>BOT){np()}ctx.drawImage(e.f.c,left+(mw-w)/2+rnd(mess),y+4,w,h);y+=hh+LH/2;continue}
const r=e.r,head=r.h>med*1.25,fs=size*(head?1.25:1),sp=fs*.3;ctx.font=`${fs}px '${fam}'`;ctx.fillStyle=pen;ctx.globalAlpha=.93;
const words=r.t.split(" "),indent=Math.max(0,Math.min(120,(r.x-60)*0.6)),rowsOut=[];let cur=[],cw=0;const maxw=RM-left-indent;
for(const w of words){const ww=ctx.measureText(w).width;if(cur.length&&cw+ww>maxw){rowsOut.push(cur);cur=[];cw=0}cur.push(w);cw+=ww+sp}if(cur.length)rowsOut.push(cur);
if(head)y+=LH/3;
for(const ro of rowsOut){if(y+LH>BOT)np();ctx.font=`${fs}px '${fam}'`;ctx.fillStyle=pen;let x=left+indent+rnd(mess*2);
const base=y+LH-9;ctx.save();ctx.translate(0,rnd(mess/2));
for(const w of ro){const ww=ctx.measureText(w).width;ctx.save();ctx.translate(x,base+rnd(mess*.8));ctx.rotate(rnd(mess*.006));ctx.fillText(w,0,0);ctx.restore();x+=ww+sp*(1+rnd(mess*.08))}
if(head){ctx.strokeStyle=pen;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(left+indent,base+8);ctx.quadraticCurveTo((left+indent+x)/2,base+8+rnd(6)+3,x,base+7+rnd(4));ctx.stroke()}
ctx.restore();y+=LH}ctx.globalAlpha=1;if(head)y+=LH/3}}
$("st").textContent="Building PDF…";const J=window.jspdf.jsPDF,doc=new J({unit:"mm",format:"a4"});
pages.forEach((c,i)=>{if(i)doc.addPage();doc.addImage(c.toDataURL("image/jpeg",.85),"JPEG",0,0,210,297)});
pages.slice(0,6).forEach(c=>{const im=new Image();im.src=c.toDataURL("image/jpeg",.5);$("prev").append(im)});
const blob=doc.output("blob");$("st").textContent=`Done — ${pages.length} page(s).`;
const b=document.createElement("button");b.className="go";b.textContent="⬇ Save / Share PDF";b.onclick=async()=>{const f=new File([blob],"handwritten-notes.pdf",{type:"application/pdf"});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(x){if(x.name==="AbortError")return}
const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="handwritten-notes.pdf";document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)};
$("dlw").append(b);
}catch(err){$("st").textContent="Error: "+(err.message||err)}$("go").disabled=false};

// ---- keep uploaded handwriting font on this device ----
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("hw",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=rej});
async function idbSet(v){try{const d=await idb();d.transaction("f","readwrite").objectStore("f").put(v,"font")}catch(x){}}
async function idbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction("f").objectStore("f").get("font");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(x){return null}}
$("ff").addEventListener("change",async e=>{const f=e.target.files[0];if(f){await idbSet(await f.arrayBuffer());$("saved").textContent="✅ Saved on this device"}});
(async()=>{const buf=await idbGet();if(!buf)return;try{const ff=new FontFace("MyHand",buf);await ff.load();document.fonts.add(ff);
const o=new Option("★ My handwriting (saved)","MyHand");$("font").prepend(o);$("font").value="MyHand";fam="MyHand";$("hw").style.fontFamily="MyHand";$("saved").textContent="✅ Using your saved handwriting"}catch(x){}})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
